<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>lets-go-look · 多源聚合</title>
<style>
  :root {
    --bg: #f6f7f5;
    --panel: #ffffff;
    --ink: #17201e;
    --muted: #6b7772;
    --line: #e2e6e3;
    --accent: #0f766e;
    --accent-soft: #e6f2f0;
    --warn: #b45309;
    --warn-soft: #fdf3e3;
    --stop: #9a3412;
    --stop-soft: #fbeae4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px 16px 64px; }
  header .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 0; }
  .badge {
    font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted);
  }
  .badge b { color: var(--ink); font-weight: 600; }
  .badge.on { background: var(--accent-soft); border-color: #bfdcd7; color: #0b5b55; }
  .badge.warn { background: var(--warn-soft); border-color: #f0d8b3; color: var(--warn); }
  .badge.off { background: var(--stop-soft); border-color: #eecdc1; color: var(--stop); }

  .searchbar {
    display: flex; gap: 8px; margin: 18px 0 8px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
  }
  input[type="search"], select {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #fbfcfb; color: var(--ink); outline: none;
  }
  input[type="search"] { flex: 1 1 220px; min-width: 0; }
  input[type="search"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    font: inherit; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button.ghost { background: transparent; color: var(--accent); border-color: #cfe3e0; }
  button:disabled { opacity: .55; cursor: default; }

  .hint { font-size: 12px; color: var(--muted); margin: 4px 2px 16px; }
  .notice {
    font-size: 13px; padding: 10px 12px; border-radius: 10px; margin: 12px 0;
    background: var(--warn-soft); border: 1px solid #f0d8b3; color: #7c4506;
  }
  .notice button { padding: 2px 8px; font-size: 12px; background: transparent; color: #7c4506; border-color: #e3c38f; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { border-color: #bcd9d4; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(23,32,30,.06); }
  .card .row { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card h3 { margin: 0; font-size: 16px; line-height: 1.35; }
  .rating { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .card p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .meta span { background: #f1f4f2; border-radius: 6px; padding: 2px 7px; }
  .meta span.src { background: var(--accent-soft); color: #0b5b55; }

  .empty { text-align: center; color: var(--muted); padding: 44px 0; font-size: 14px; }

  .sheet-mask {
    position: fixed; inset: 0; background: rgba(16,24,22,.42); display: none;
    align-items: flex-end; justify-content: center; z-index: 30; padding: 0;
  }
  .sheet-mask.open { display: flex; }
  .sheet {
    background: var(--panel); width: 100%; max-width: 720px; max-height: 86vh; overflow: auto;
    border-radius: 18px 18px 0 0; padding: 18px 18px 28px; position: relative;
  }
  @media (min-width: 760px) {
    .sheet-mask { align-items: center; padding: 24px; }
    .sheet { border-radius: 18px; }
  }
  .sheet h2 { margin: 0 32px 4px 0; font-size: 19px; }
  .sheet .close {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; padding: 0;
    background: #f1f4f2; color: var(--muted); border-radius: 50%; font-size: 18px; line-height: 1;
  }
  .kv { display: flex; gap: 10px; font-size: 13px; color: var(--muted); margin: 4px 0; }
  .kv b { color: var(--ink); font-weight: 500; }
  .divider { height: 1px; background: var(--line); margin: 14px 0; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list button.ep {
    text-align: left; background: #fbfcfb; color: var(--ink); border: 1px solid var(--line);
    padding: 9px 12px; font-size: 13px; border-radius: 9px;
  }
  .list button.ep:hover { border-color: #bfdcd7; background: var(--accent-soft); }
  .resolved {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #f1f4f2;
    font-size: 12px; word-break: break-all; color: #27403b;
  }
  .resolved code { color: #0b5b55; }
  .tag { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>lets-go-look</h1>
      <span class="sub">多源影视 / 短剧 / 小说聚合</span>
    </div>
    <div class="badges" id="badges"><span class="badge">正在读取来源状态…</span></div>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="输入关键词，例如：雾、图书馆、列车" autocomplete="off">
    <select id="type">
      <option value="">全部类型</option>
      <option value="drama">短剧</option>
      <option value="video">影视</option>
      <option value="novel">小说</option>
    </select>
    <button id="go">搜索</button>
  </div>
  <div class="hint">当前可用数据来自仓库自造的演示目录（虚构内容）；已接入但未授权的来源会显示为「未就绪」。</div>

  <div id="notice"></div>
  <div id="results" class="grid"></div>
  <div id="empty" class="empty">输入关键词开始检索</div>
</div>

<div class="sheet-mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const state = { q: "", type: "", page: 1, items: [], total: 0, perSource: [], degraded: false };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

const typeLabel = { drama: "短剧", video: "影视", novel: "小说", comic: "漫画" };

async function api(path) {
  const res = await fetch(path, { headers: { Accept: "application/json" } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = data.error || {};
    const e = new Error(err.message || `请求失败（${res.status}）`);
    e.code = err.code || "INTERNAL_ERROR";
    throw e;
  }
  return data;
}

async function loadHealth() {
  const el = document.getElementById("badges");
  try {
    const h = await api("/health");
    const by = h.by_status || {};
    el.innerHTML = [
      `<span class="badge">来源 <b>${h.source_count}</b></span>`,
      `<span class="badge on">可用 <b>${by.active || 0}</b></span>`,
      `<span class="badge warn">未就绪 <b>${by.stub || 0}</b></span>`,
      `<span class="badge off">未授权 <b>${by.disabled || 0}</b></span>`,
    ].join("");
  } catch (e) {
    el.innerHTML = `<span class="badge off">服务状态读取失败：${esc(e.message)}</span>`;
  }
}

function renderNotice() {
  const el = document.getElementById("notice");
  if (!state.degraded) { el.innerHTML = ""; return; }
  const pending = state.perSource.filter((r) => r.error && r.error.code !== "SOURCE_DISABLED");
  if (!pending.length) { el.innerHTML = ""; return; }
  const names = pending.map((r) => `${esc(r.display_name)}（${esc(r.error.code)}）`).join("、");
  el.innerHTML = `<div class="notice">部分来源未返回数据：${names}。其余来源结果已正常展示。<button id="toggle">查看详情</button>
    <div id="detail-src" style="display:none;margin-top:8px;font-size:12px;line-height:1.7">${pending
      .map((r) => `${esc(r.display_name)}：${esc(r.error.message)}`).join("<br>")}</div></div>`;
  document.getElementById("toggle").onclick = () => {
    const box = document.getElementById("detail-src");
    box.style.display = box.style.display === "none" ? "block" : "none";
  };
}

function renderResults() {
  const grid = document.getElementById("results");
  const empty = document.getElementById("empty");
  if (!state.items.length) {
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = state.q ? `没有找到与「${state.q}」相关的内容` : "输入关键词开始检索";
    return;
  }
  empty.style.display = "none";
  grid.innerHTML = state.items.map((item, index) => {
    const rating = item.rating == null ? "" : `<span class="rating">${item.rating.toFixed(1)}</span>`;
    const sources = item.sources || [];
    const srcChips = sources.map((s) => `<span class="src">${esc(s.display_name)}</span>`).join("");
    return `<article class="card" data-index="${index}">
      <div class="row"><h3>${esc(item.title)}</h3>${rating}</div>
      <p>${esc(item.summary || "暂无简介")}</p>
      <div class="meta">
        <span>${esc(typeLabel[item.media_type] || item.media_type)}</span>
        ${item.author ? `<span>${esc(item.author)}</span>` : ""}
        ${item.status ? `<span>${esc(item.status)}</span>` : ""}
        ${sources.length > 1 ? `<span>${sources.length} 个来源</span>` : ""}
        ${srcChips}
      </div>
    </article>`;
  }).join("");

  grid.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => openDetail(state.items[Number(card.dataset.index)]));
  });
}

async function doSearch() {
  const q = document.getElementById("q").value.trim();
  if (!q) { document.getElementById("q").focus(); return; }
  const type = document.getElementById("type").value;
  const btn = document.getElementById("go");
  btn.disabled = true;
  try {
    const params = new URLSearchParams({ q });
    if (type) params.set("type", type);
    const data = await api(`/search?${params.toString()}`);
    state.q = q; state.type = type; state.page = data.page;
    state.items = data.items || []; state.total = data.total; state.perSource = data.per_source || [];
    state.degraded = !!data.degraded;
    renderNotice(); renderResults();
  } catch (e) {
    state.items = []; renderNotice();
    document.getElementById("results").innerHTML = `<div class="notice">检索失败：${esc(e.message)}（${esc(e.code)}）</div>`;
    document.getElementById("empty").style.display = "none";
  } finally {
    btn.disabled = false;
  }
}

async function openDetail(item) {
  const mask = document.getElementById("mask");
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `<h2>${esc(item.title)}</h2><div class="tag">加载中…</div>`;
  mask.classList.add("open");
  try {
    const data = await api(`/detail?source=${encodeURIComponent(item.source)}&id=${encodeURIComponent(item.external_id)}`);
    const detail = data.item;
    const episodes = data.episodes || [];
    const chapters = data.chapters || [];
    const rows = episodes.length ? episodes : chapters;
    const kind = episodes.length ? "集" : "章";

    sheet.innerHTML = `<button class="close" id="close">×</button>
      <h2>${esc(detail.title)}</h2>
      <div class="tag">${esc(typeLabel[detail.media_type] || detail.media_type)}${detail.status ? " · " + esc(detail.status) : ""}${detail.rating == null ? "" : " · 评分 " + detail.rating.toFixed(1)}</div>
      ${detail.author ? `<div class="kv"><span>作者</span><b>${esc(detail.author)}</b></div>` : ""}
      <div class="kv"><span>来源</span><b>${esc(item.source)}</b></div>
      <p style="font-size:13px;color:#4b5754;margin:10px 0 0">${esc(detail.summary || "暂无简介")}</p>
      ${rows.length ? `<div class="divider"></div><div class="list">${rows.map((r) => `
        <button class="ep" data-ep="${esc(r.external_id)}">
          ${esc(r.title)} <span class="tag">${kind} ${r.index}${r.duration_seconds ? " · " + Math.round(r.duration_seconds / 60) + " 分钟" : ""}${r.word_count ? " · " + r.word_count + " 字" : ""}</span>
        </button>`).join("")}</div>`
      : `<div class="divider"></div><div class="tag">该来源未提供分集 / 分章列表，可直接解析整部。</div>
         <div class="list" style="margin-top:8px"><button class="ep" data-ep="">解析整部</button></div>`}
      <div id="resolve-out"></div>`;

    sheet.querySelector("#close").onclick = () => mask.classList.remove("open");
    sheet.querySelectorAll(".ep").forEach((btn) => {
      btn.addEventListener("click", () => resolve(item, btn.dataset.ep, btn));
    });
  } catch (e) {
    sheet.innerHTML = `<button class="close" id="close">×</button>
      <h2>${esc(item.title)}</h2>
      <div class="notice">无法读取详情：${esc(e.message)}（${esc(e.code)}）</div>`;
    sheet.querySelector("#close").onclick = () => mask.classList.remove("open");
  }
}

async function resolve(item, episodeId, btn) {
  const out = document.getElementById("resolve-out");
  const label = btn.textContent.trim();
  btn.disabled = true;
  out.innerHTML = `<div class="tag" style="margin-top:10px">正在解析…</div>`;
  try {
    const params = new URLSearchParams({ source: item.source, id: item.external_id });
    if (episodeId) params.set("episode", episodeId);
    const data = await api(`/resolve?${params.toString()}`);
    out.innerHTML = `<div class="resolved">
      <div class="tag">${esc(label)}</div>
      <code>${esc(data.url)}</code>
      <div class="tag" style="margin-top:6px">${esc(data.note || "")}</div>
    </div>`;
  } catch (e) {
    out.innerHTML = `<div class="notice">解析失败：${esc(e.message)}（${esc(e.code)}）</div>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("go").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
document.getElementById("type").addEventListener("change", () => { if (document.getElementById("q").value.trim()) doSearch(); });
document.getElementById("mask").addEventListener("click", (e) => {
  if (e.target.id === "mask") e.currentTarget.classList.remove("open");
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("mask").classList.remove("open"); });

loadHealth();
doSearch();
</script>
</body>
</html>
